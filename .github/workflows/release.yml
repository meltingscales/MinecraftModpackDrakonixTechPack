name: Release

# Fires on `just tag <version>` (tags + pushes vX.Y.Z), builds the packwiz
# pack into server/client zips, and attaches them to a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

      - name: Build modpack zips
        run: just packwiz-export

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/drakonixtechpack-*-server.zip
            build/drakonixtechpack-*-client.mrpack
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
